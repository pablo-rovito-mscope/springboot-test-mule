spring:
  application:
    name: crud-springboot
  
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
      path: /h2-console
      
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        
server:
  port: 8080
  
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-for-jwt-tokens-here}
  expiration: ${JWT_EXPIRATION:86400000}
  
logging:
  level:
    root: INFO
    com.example.crud: INFO
    org.springframework.security: INFO